name: Moon LogLens CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    env:
      MOONBIT_VERSION: 0.10.14+7d59c7ec9
      MOON_HOME: ${{ runner.temp }}/moonbit-0.10.14
    steps:
      - uses: actions/checkout@v4
      - name: Install the official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Show toolchain version
        run: |
          moon version --all
          case "$(moonc -v)" in
            "v${MOONBIT_VERSION} "*) ;;
            *) echo "Unexpected MoonBit compiler version" >&2; exit 1 ;;
          esac
      - name: Run reproducible acceptance
        run: python3 scripts/acceptance.py --output "$RUNNER_TEMP/loglens-acceptance"
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loglens-acceptance
          path: ${{ runner.temp }}/loglens-acceptance
