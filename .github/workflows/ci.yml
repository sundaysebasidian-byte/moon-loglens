name: Moon LogLens CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain version
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Check
        run: moon check --target native
      - name: Build
        run: moon build --target native
      - name: MoonBit tests
        run: moon test --target native
      - name: CLI integration tests
        run: python3 tests/cli_smoke.py
